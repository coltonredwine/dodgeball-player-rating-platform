services:
  db:
    image: postgres:16
    container_name: player-scores-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: player_scores
    volumes:
      - player_scores_pgdata:/var/lib/postgresql/data

volumes:
  player_scores_pgdata:
