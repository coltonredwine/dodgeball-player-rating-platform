services:
  - type: web
    name: player-scores
    env: node
    plan: free
    buildCommand: npm install && npm run prisma:generate && npm run build
    preDeployCommand: npx prisma migrate deploy && npm run setup:init
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: player-scores-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SUPERADMIN_EMAIL
        value: coltonredwine@gmail.com
      - key: SUPERADMIN_PASSCODE
        sync: false

databases:
  - name: player-scores-db
    plan: free
